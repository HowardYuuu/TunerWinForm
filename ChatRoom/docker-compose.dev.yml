version: '3.8'

services:
  chatroom:
    build:
      context: ../
      dockerfile: ChatRoom/Dockerfile
    container_name: chatroom-app-dev
    ports:
      - "5180:8080"
      - "5181:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
    volumes:
      # 開發模式下掛載原始碼，支援熱重載
      - ./wwwroot:/app/wwwroot
      - ./appsettings.Development.json:/app/appsettings.Development.json
      - chatroom-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chatroom-network

volumes:
  chatroom-logs:
    driver: local

networks:
  chatroom-network:
    driver: bridge
